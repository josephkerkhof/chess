info:
  name: Create Game
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/games"
  body:
    type: json
    data: |-
      {
        "players": [
          "{{ada_public_id}}",
          "{{grace_public_id}}"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
